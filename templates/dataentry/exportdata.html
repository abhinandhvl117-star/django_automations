{% extends 'base.html' %}
{% block content %}

    <div class="container alert-secondary shadow" style="max-width: 800px; padding: 50px; margin-top: 100px; border-radius: 10px;">
        <h3 class="text-center">Export data from the database table</h3>
        <form method="post" style="width: 600px; margin: auto; padding-top: 20px;">
            {% csrf_token %}

            <div class="form-group" style="padding-bottom: 8px; padding-top: 8px;">
                <label for="">Select database</label>
                <select name="model_name" id="" class="form-control" required>
                    <option value="" disabled selected>select</option>
                    {% for model in custom_models %}
                    <option value="{{ model }}">{{ model }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <input type="submit" value="Export Data" class="btn btn-dark">
            </div>
        </form>
        
    </div>
{% endblock %}
