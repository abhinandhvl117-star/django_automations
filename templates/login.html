{% extends 'base.html' %}
{% block content %}
{% load crispy_forms_tags %}
    <div class="container mt-5" style="width: 600px;">
        <p>Login</p>
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
            {{ form | crispy }}
            </div>

            <div class="form-group">
            <button type="submit" class="btn btn-dark">LOGIN</button>
            </div>
        </form>
    </div>

{% endblock %}
