{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="{% static 'js/custom.js' %}"></script>
    <title>Automation</title>
</head>
<body>
    <nav class="navbar navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="{% url 'home' %}">Automation</a>
            {% if user.is_authenticated %}
            <div>
                Username: <b>{{ user }}</b>
                &nbsp;<a class="float-right btn btn-dark text-light" href="{% url 'logout' %}">Logout</a>
            </div>
            {% else %}
            <div>
                <a class="float-right text-decoration-none text-dark" href="{% url 'login' %}">Login</a>
                &nbsp;<a class="float-right btn btn-outline-dark" href="{% url 'register' %}">Registration</a>
            </div>
            {% endif %}
        </div>
    </nav>
    {% block content %}

    {% endblock %}
</body>
</html>
